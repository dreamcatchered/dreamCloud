<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dreamCloud</title>
    <link rel="icon" href="https://api.dreampartners.online/icons/cloud/favicon.ico">
    <link rel="icon" href="https://api.dreampartners.online/icons/cloud/logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="https://api.dreampartners.online/icons/cloud/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-color: #e0e0e0;
            --btn-bg: #000000;
            --btn-text: #ffffff;
            --border-radius: 16px;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            font-weight: 800;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            margin-top: 0;
        }

        p {
            font-weight: 400;
            font-size: 1.1rem;
            color: gray;
            margin-bottom: 2rem;
            margin-top: 0;
        }

        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: var(--border-radius);
            padding: 3rem 1rem;
            cursor: pointer;
            transition: border-color 0.3s ease;
            position: relative;
            background-color: #fafafa;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--text-color);
            background-color: #f0f0f0;
        }

        .upload-area input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        button {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: var(--border-radius);
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.3s;
            margin-top: 1.5rem;
            box-sizing: border-box;
        }

        button:hover {
            opacity: 0.8;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-container {
            display: none;
            margin-top: 1.5rem;
            text-align: left;
        }

        .progress-bar-bg {
            background-color: var(--border-color);
            border-radius: var(--border-radius);
            height: 8px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .progress-bar-fill {
            background-color: var(--text-color);
            height: 100%;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .progress-bar-fill.processing {
            background: linear-gradient(90deg, var(--text-color) 25%, #666 50%, var(--text-color) 75%);
            background-size: 200% 100%;
            animation: loading-shimmer 1.5s infinite linear;
        }
        
        @keyframes loading-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: gray;
            font-weight: 600;
        }

        #result {
            margin-top: 2rem;
            text-align: left;
            display: none;
        }

        #result input {
            width: 100%;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            background: transparent;
            color: var(--text-color);
            font-family: inherit;
            box-sizing: border-box;
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .history-container {
            margin-top: 4rem;
            text-align: left;
            width: 100%;
            display: none;
        }

        .history-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            background-color: #fafafa;
            transition: border-color 0.2s;
        }
        
        .history-item:hover {
            border-color: var(--text-color);
        }

        .history-item-info {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            overflow: hidden;
            flex-grow: 1;
            margin-right: 1rem;
        }

        .history-item-name {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item-meta {
            font-size: 0.85rem;
            color: gray;
        }

        .history-item-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            margin-top: 0;
            width: auto;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--text-color);
        }

        .btn-outline:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
            opacity: 1;
        }
        
        .btn-delete {
            background-color: transparent;
            color: #ff4d4f;
            border: 1px solid #ff4d4f;
        }

        .btn-delete:hover {
            background-color: #ff4d4f;
            color: #ffffff;
            opacity: 1;
        }
        
        @media (max-width: 480px) {
            .history-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            .history-item-actions {
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>dreamCloud</h1>
        <p>Unlimited file storage.</p>

        <div class="upload-area" id="dropZone">
            <div class="upload-icon">📁</div>
            <div id="fileInfo">Drag & drop, paste (Ctrl+V) or click</div>
            <input type="file" id="fileInput">
        </div>

        <button id="uploadBtn" disabled>Upload File</button>

        <div class="progress-container" id="progressContainer">
            <div style="font-weight: 600; margin-bottom: 0.5rem;" id="progressText">Uploading... 0%</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
            <div class="progress-stats">
                <span id="speedText">0 MB/s</span>
                <span id="etaText">ETA: --s</span>
            </div>
        </div>

        <div id="result">
            <p style="color:var(--text-color); margin-bottom: 0.5rem; font-weight:600;">File uploaded successfully!</p>
            <input type="text" id="fileUrl" readonly>
            <button onclick="copyUrl()">Copy URL</button>
            <button class="btn-outline" onclick="resetUpload()" style="margin-top: 0.5rem;">Upload Another File</button>
        </div>

        <div class="history-container" id="historyContainer">
            <div class="history-title">Upload History</div>
            <div class="history-list" id="historyList">
                <!-- History items will be injected here -->
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const uploadBtn = document.getElementById('uploadBtn');
        const resultDiv = document.getElementById('result');
        const fileUrlInput = document.getElementById('fileUrl');
        
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const speedText = document.getElementById('speedText');
        const etaText = document.getElementById('etaText');
        
        const historyContainer = document.getElementById('historyContainer');
        const historyList = document.getElementById('historyList');

        const csrfToken = "{{ csrf_token }}";
        const MAX_FILE_SIZE = {{ max_file_size }}; // 2000MB (self-hosted Bot API)

        let selectedFile = null;
        let uploadXHR = null;

        renderHistory();

        // Paste support
        window.addEventListener('paste', e => {
            const items = e.clipboardData.items;
            for (let i = 0; i < items.length; i++) {
                if (items[i].kind === 'file') {
                    const file = items[i].getAsFile();
                    handleFiles([file]);
                    break;
                }
            }
        });

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        });

        fileInput.addEventListener('change', function() {
            handleFiles(this.files);
        });

        function handleFiles(files) {
            if (files.length > 0) {
                const file = files[0];
                
                // Strict size check
                if (file.size > MAX_FILE_SIZE) {
                    showNotification(`File too large (${formatSize(file.size)}). Max: 2000MB.`, true);
                    resetUpload();
                    return;
                }

                selectedFile = file;
                fileInfo.textContent = selectedFile.name + ` (${formatSize(selectedFile.size)})`;
                uploadBtn.disabled = false;
                resultDiv.style.display = 'none';
                progressContainer.style.display = 'none';
            }
        }

        function formatSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        uploadBtn.addEventListener('click', () => {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('file', selectedFile);

            uploadBtn.style.display = 'none';
            dropZone.style.display = 'none';
            
            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';
            progressBar.classList.remove('processing');
            progressText.textContent = `Uploading... 0%`;
            speedText.textContent = `0 MB/s`;
            etaText.textContent = `ETA: --s`;

            const browserVerify = btoa(csrfToken + "_dream");

            uploadXHR = new XMLHttpRequest();
            uploadXHR.open('POST', '/upload', true);
            uploadXHR.setRequestHeader('x-csrf-token', csrfToken);
            uploadXHR.setRequestHeader('x-browser-verify', browserVerify);

            let startTime = Date.now();
            let previousLoaded = 0;
            let previousTime = startTime;

            uploadXHR.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const percentComplete = (e.loaded / e.total) * 100;
                    progressBar.style.width = percentComplete + '%';
                    
                    if (percentComplete >= 99.9) {
                        progressText.textContent = `Finalizing...`;
                        progressBar.classList.add('processing');
                    } else {
                        progressText.textContent = `Uploading... ${Math.round(percentComplete)}%`;
                        const currentTime = Date.now();
                        const timeDiff = (currentTime - previousTime) / 1000;
                        if (timeDiff > 0.5) {
                            const loadedDiff = e.loaded - previousLoaded;
                            const speedBps = loadedDiff / timeDiff;
                            speedText.textContent = `${formatSize(speedBps)}/s`;
                            const remainingBytes = e.total - e.loaded;
                            const etaSeconds = speedBps > 0 ? Math.round(remainingBytes / speedBps) : 0;
                            etaText.textContent = `ETA: ${etaSeconds}s`;
                            previousLoaded = e.loaded;
                            previousTime = currentTime;
                        }
                    }
                }
            });

            uploadXHR.addEventListener('load', () => {
                if (uploadXHR.status >= 200 && uploadXHR.status < 300) {
                    const data = JSON.parse(uploadXHR.responseText);
                    fileUrlInput.value = data.url;
                    progressContainer.style.display = 'none';
                    resultDiv.style.display = 'block';
                    saveToHistory(selectedFile.name, selectedFile.size, data.url);
                    showNotification('Upload complete!');
                } else {
                    let errDetail = uploadXHR.statusText;
                    try {
                        const err = JSON.parse(uploadXHR.responseText);
                        errDetail = err.detail || errDetail;
                    } catch(e){}
                    showNotification(`Upload failed: ${errDetail}`, true);
                    resetUpload();
                }
            });

            uploadXHR.addEventListener('error', () => {
                showNotification('Upload failed: Network error.', true);
                resetUpload();
            });
            
            uploadXHR.addEventListener('abort', () => {
                showNotification('Upload aborted.');
                resetUpload();
            });

            uploadXHR.send(formData);
        });

        function resetUpload() {
            selectedFile = null;
            fileInput.value = '';
            fileInfo.textContent = 'Drag & drop, paste (Ctrl+V) or click';
            uploadBtn.textContent = 'Upload File';
            uploadBtn.disabled = true;
            uploadBtn.style.display = 'block';
            dropZone.style.display = 'block';
            resultDiv.style.display = 'none';
            progressContainer.style.display = 'none';
            progressBar.classList.remove('processing');
        }

        function showNotification(message, isError = false) {
            const toast = document.createElement('div');
            toast.style.position = 'fixed';
            toast.style.bottom = '20px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.padding = '1rem 2rem';
            toast.style.borderRadius = 'var(--border-radius)';
            toast.style.backgroundColor = isError ? '#ff4d4f' : '#000000';
            toast.style.color = '#ffffff';
            toast.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)';
            toast.style.zIndex = '1000';
            toast.style.fontWeight = '600';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => document.body.removeChild(toast), 500);
            }, 3000);
        }

        function copyUrl() {
            fileUrlInput.select();
            document.execCommand('copy');
            showNotification('URL copied to clipboard!');
        }
        
        function copyText(text) {
            const tempInput = document.createElement('input');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            showNotification('URL copied to clipboard!');
        }

        function getHistory() {
            const history = localStorage.getItem('dreamCloudHistory');
            return history ? JSON.parse(history) : [];
        }

        function saveToHistory(name, size, url) {
            const history = getHistory();
            const newItem = { id: Date.now().toString(), name: name, size: size, url: url, date: new Date().toISOString() };
            history.unshift(newItem);
            localStorage.setItem('dreamCloudHistory', JSON.stringify(history));
            renderHistory();
        }

        function deleteFromHistory(id) {
            let history = getHistory();
            history = history.filter(item => item.id !== id);
            localStorage.setItem('dreamCloudHistory', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const history = getHistory();
            if (history.length === 0) {
                historyContainer.style.display = 'none';
                return;
            }
            historyContainer.style.display = 'block';
            historyList.innerHTML = '';
            history.forEach(item => {
                const dateObj = new Date(item.date);
                const dateStr = dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const itemEl = document.createElement('div');
                itemEl.className = 'history-item';
                itemEl.innerHTML = `
                    <div class="history-item-info">
                        <div class="history-item-name" title="${item.name}">${item.name}</div>
                        <div class="history-item-meta">${formatSize(item.size)} • ${dateStr}</div>
                    </div>
                    <div class="history-item-actions">
                        <button class="btn-small btn-outline" onclick="window.open('${item.url}', '_blank')">Open</button>
                        <button class="btn-small btn-outline" onclick="copyText('${item.url}')">Copy</button>
                        <button class="btn-small btn-delete" onclick="deleteFromHistory('${item.id}')">Delete</button>
                    </div>
                `;
                historyList.appendChild(itemEl);
            });
        }
    </script>
</body>
</html>
